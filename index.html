<!DOCTYPE html>
<html>
<head>
    <title>FastAPI Feedback Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
        }

        .container {
            width: 350px;
        }

        h2 {
            margin-bottom: 20px;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        textarea {
            resize: none;
            height: 80px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #444;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #222;
        }

        #response {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>FastAPI Feedback Form</h2>

    <form>
        <input type="text" placeholder="Student Name" required>

        <input type="text" placeholder="Topic" required>

        <input type="number" placeholder="Rating 1 to 5" min="1" max="5" required>

        <textarea placeholder="Comment"></textarea>

        <button type="submit">Submit Feedback</button>
    </form>

    <div id="response">
        <h3>Response</h3>
    </div>
</div>

</body>
</html>
