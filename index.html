<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI Feedback Form</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f5f5f5;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:450px;
            background:white;
            padding:30px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
            border-radius:5px;
        }

        h1{
            margin-bottom:20px;
            font-size:32px;
        }

        input,
        textarea{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border:1px solid #ccc;
            font-size:16px;
        }

        textarea{
            resize:none;
            height:90px;
        }

        button{
            width:100%;
            padding:12px;
            background:#333;
            color:white;
            border:none;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#555;
        }

        h2{
            margin-top:25px;
            margin-bottom:10px;
        }

        #response{
            background:#f2f2f2;
            height:40px;
            border-radius:3px;
            padding:10px;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>FastAPI Feedback Form</h1>

        <form>

            <input
                type="text"
                placeholder="Student Name"
                required
            >

            <input
                type="text"
                placeholder="Topic"
                required
            >

            <input
                type="number"
                placeholder="Rating 1 to 5"
                min="1"
                max="5"
                required
            >

            <textarea
                placeholder="Comment"
                required
            ></textarea>

            <button type="submit">
                Submit Feedback
            </button>

        </form>

        <h2>Response</h2>

        <div id="response"></div>

    </div>

</body>
</html>
